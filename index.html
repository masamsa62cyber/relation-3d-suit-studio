<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Relation 3D Suit Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>/* 仮縫い室の画面: 生成りの作業台に、チャコールの線とブルーブラックの差し色 */
:root{
  --ground:#e9e9e7; --panel:#faf9f6; --panel-2:#f1efea; --ink:#1d2126; --mute:#6a6f76; --line:#d5d2ca; --accent:#22344f; --accent-ink:#fff; --warn:#94511a; --warn-bg:#f7ecdf; --ok:#2e6b52; --chalk:#b4a98e;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 404px;grid-template-rows:56px minmax(0,1fr);grid-template-areas:"bar bar" "stage panel"}
.bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0;z-index:5}
.brand{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.04em;color:var(--accent);white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin-left:9px}
.spacer{flex:1;min-width:0}
.store-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:4px 10px;border:1px solid var(--line);border-radius:3px;white-space:nowrap}
.store-badge i{width:7px;height:7px;border-radius:50%;background:var(--chalk)}
.store-badge.cloud i{background:var(--ok)}
.tbtn{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:var(--panel-2)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn.primary:hover{background:#2c4162}
.tbtn[disabled]{opacity:.45;cursor:default}
.stagewrap{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--ground);overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;cursor:grab}
#stage canvas:active{cursor:grabbing}
.views{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:3px;max-width:calc(100% - 28px)}
.views button{height:36px;padding:0 12px;font-size:13px;border-right:1px solid var(--line)}
.views button:last-child{border-right:0}
.views button:hover{background:var(--panel-2)}
.views button.on{background:var(--accent);color:#fff}
.dispbox{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:12.5px}
.dispbox b{font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.dispbox label{display:flex;align-items:center;gap:7px;cursor:pointer;min-height:22px}
.dispbox input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.dispbox input[type=color]{width:26px;height:20px;padding:0;border:1px solid var(--line);background:none}
.insidebtn{position:absolute;right:14px;top:14px}
.insidetag{position:absolute;right:14px;top:58px;max-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:12.5px;line-height:1.55}
.insidetag strong{display:block;font-size:13px;color:var(--accent)}
.hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-size:12px;color:var(--mute);background:rgba(250,249,246,.82);padding:3px 10px;border-radius:3px;white-space:nowrap;pointer-events:none}
.panel{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line);flex:none}
.tabs button{padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);border-bottom:2px solid transparent}
.tabs button svg{width:30px;height:30px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sect{font-size:11px;letter-spacing:.1em;color:var(--mute);padding:14px 16px 5px;font-weight:700}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 14px;gap:11px;align-items:center;width:100%;padding:8px 16px;text-align:left;border-bottom:1px solid var(--panel-2)}
.row:hover{background:var(--panel-2)}
.row .ic{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:2px;display:grid;place-items:center;overflow:hidden;background-size:cover;background-position:center}
.row .ic svg{width:38px;height:38px}
.row .lbl{font-size:12px;color:var(--mute);display:block}
.row .val{font-size:13.5px;font-weight:500;display:block;overflow-wrap:anywhere}
.row .chev{color:var(--mute)}
.row .warnmark{color:var(--warn);font-size:11.5px;display:block}
.subhead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.subhead .back{height:34px;padding:0 10px 0 6px;font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.subhead h2{margin:0;font-size:14.5px;font-weight:700;min-width:0}
.note{margin:10px 14px 0;padding:8px 10px;font-size:12.5px;line-height:1.6;background:var(--panel-2);color:var(--mute);border-radius:2px}
.warn{margin:10px 14px 0;padding:8px 10px;font-size:12.5px;line-height:1.6;background:var(--warn-bg);color:var(--warn);border-radius:2px}
.warn.info{background:var(--panel-2);color:var(--mute)}
.warns{padding-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:12px 14px}
.opt{position:relative;display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:2px;background:#fff;text-align:left;min-width:0}
.opt:hover{border-color:#9a9da3}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt .pic{aspect-ratio:1;display:grid;place-items:center;color:var(--ink);--panel:#fff;background-size:cover;background-position:center}
.opt .pic svg{width:84%;height:84%}
.opt .t{padding:5px 6px 6px;font-size:11.5px;line-height:1.38;border-top:1px solid var(--panel-2);overflow-wrap:anywhere;flex:1}
.opt .t small{display:block;color:var(--mute);font-size:10.5px}
.opt .check{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center;font-size:12px;line-height:1}
.opt.on .check{display:grid}
.opt .tag{position:absolute;left:4px;top:4px;font-size:9.5px;padding:0 4px;background:var(--panel-2);color:var(--mute);border-radius:2px;line-height:15px}
.grid.colors{grid-template-columns:repeat(4,minmax(0,1fr))}
.tools{display:flex;gap:8px;padding:12px 14px 2px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);min-width:0}
.field input,.field select,.input{height:38px;border:1px solid var(--line);border-radius:2px;background:#fff;padding:0 9px;color:var(--ink);font-size:14px;width:100%}
.input{flex:1;min-width:120px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.chip{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:15px;font-size:12px;background:#fff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fine{margin:12px 14px 0;border:1px solid var(--line);border-radius:2px;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fine h3{grid-column:1/-1;margin:0;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.fine h3 button{font-size:12px;color:var(--accent);font-weight:400;text-decoration:underline}
.fine input[type=color]{padding:2px;height:34px}
.fine input[type=range]{height:30px;padding:0;border:0;accent-color:var(--accent)}
.fine .wide{grid-column:1/-1}
.empty{padding:24px 16px;color:var(--mute);font-size:13px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(29,33,38,.44);display:flex;align-items:center;justify-content:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border-radius:4px;width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;min-width:0}
.dlg.sm{width:min(460px,100%)}
.dlg header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none}
.dlg header h2{margin:0;font-size:16px;font-family:var(--serif);font-weight:600;flex:1;min-width:0}
.dlg .body{overflow-y:auto;padding:14px 16px;min-height:0;flex:1}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:11px 16px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.x{width:34px;height:34px;font-size:18px;color:var(--mute)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.formgrid .wide{grid-column:1/-1}
.table-wrap{overflow-x:auto}
.ftable{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.ftable th{font-size:11.5px;text-align:left;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:500}
.ftable td{padding:7px 8px;border-bottom:1px solid var(--panel-2);vertical-align:middle}
.ftable tr.off td{opacity:.48}
.sw{width:36px;height:36px;border:1px solid var(--line);background-size:cover;background-position:center;border-radius:2px;display:block}
.linkbtn{color:var(--accent);text-decoration:underline;font-size:12.5px;margin-right:9px;white-space:nowrap}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.look{border:1px solid var(--line);background:#fff;border-radius:2px;display:flex;flex-direction:column;min-width:0}
.look img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--ground);display:block}
.look .m{padding:7px 9px;font-size:12.5px;flex:1;overflow-wrap:anywhere}
.look .m small{display:block;color:var(--mute);font-size:11px}
.look .place{display:inline-block;font-size:10.5px;padding:0 5px;margin-top:3px;border:1px solid var(--line);border-radius:2px;color:var(--mute)}
.look .place.cloud{color:var(--ok);border-color:var(--ok)}
.look .a{display:flex;gap:4px;padding:0 9px 8px;flex-wrap:wrap}
.spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);font-size:13px;gap:0}
.spec dt,.spec dd{margin:0;padding:5px 0;border-bottom:1px solid var(--panel-2)}
.spec dt{color:var(--mute)}
.spec h3{grid-column:1/-1;margin:12px 0 2px;font-size:12.5px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:3px;font-size:13px;z-index:50;max-width:calc(100vw - 32px)}
.preview{width:100%;max-height:60vh;object-fit:contain;background:var(--ground);display:block}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 0;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio small{display:block;color:var(--mute);font-size:12px}
.loading{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;z-index:60;font-family:var(--serif);color:var(--accent);font-size:22px;letter-spacing:.05em;text-align:center}
.loading small{display:block;font-family:var(--sans);font-size:12px;color:var(--mute);letter-spacing:0;margin-top:6px}
.err{padding:30px max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:auto}
@media (max-width:1040px){ .brand small,.store-badge span.long{display:none} }
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:50px minmax(0,1fr) minmax(0,46%);grid-template-areas:"bar" "stage" "panel"}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .brand{font-size:19px}
  .bar{gap:6px}
  .tbtn{padding:0 9px;height:34px;font-size:12px}
  .dispbox{padding:6px 8px;font-size:11.5px;left:max(8px,env(safe-area-inset-left,0px));top:8px;gap:3px}
  .dispbox b{display:none}
  .views{left:max(8px,env(safe-area-inset-left,0px));bottom:8px;max-width:calc(100% - 16px)}
  .views button{padding:0 9px;height:32px;font-size:12px}
  .insidebtn{right:max(8px,env(safe-area-inset-right,0px));top:8px}
  .insidetag{right:max(8px,env(safe-area-inset-right,0px));top:50px;max-width:170px;font-size:11.5px;padding:6px 8px}
  .hint{display:none}
  .tabs button{flex-direction:column;justify-content:center;padding:5px 1px 4px;gap:1px;font-size:10.5px;white-space:nowrap;letter-spacing:-.02em}
  .tabs button svg{width:18px;height:18px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));padding:10px}
  .formgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:440px){ .store-badge{padding:3px 6px;font-size:10.5px} .tbtn .lb{display:none} .tbtn .ico{display:inline} }
@media (min-width:441px){ .tbtn .ico{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:2px 0 8px}
.seg button{flex:1;padding:4px 10px;font-size:12px;background:#fff;color:var(--mute)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.optsum{position:sticky;top:0;z-index:2;background:var(--panel,#fff);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:2px 0 6px}
.optsum>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.optsum .lbl{font-size:12px;color:var(--mute)}
.optsum .sum{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.optsum small{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.5}
.optlist{display:flex;flex-direction:column}
.optrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 12px 9px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.optrow input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.optrow .p{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.optrow.on .n{font-weight:700}.optrow.on .p{color:var(--ink,#222)}

.estpage{position:fixed;inset:0;z-index:30;background:var(--ground);display:flex;flex-direction:column;overflow:hidden}
.estpage[hidden]{display:none}
.ehead{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ehead h2{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--accent);margin:0;white-space:nowrap}
.ebody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;overflow:hidden}
.emain{overflow:auto;padding:14px 16px 24px}
.esum{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:16px}
.esum h3{font-size:13px;letter-spacing:.1em;color:var(--mute);margin:0 0 8px}
.etabs{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;background:var(--panel);margin-bottom:12px;width:max-content;max-width:100%}
.etabs button{padding:8px 18px;font-size:13.5px;border-right:1px solid var(--line)}
.etabs button:last-child{border-right:0}
.etabs button.on{background:var(--accent);color:#fff;font-weight:700}
.esearch{width:100%;max-width:420px;margin-bottom:10px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ecard{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.ecard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.epick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.esw{flex:none;width:44px;height:44px;border-radius:3px;background-size:cover;border:1px solid var(--line)}
.et{min-width:0;display:flex;flex-direction:column}
.et b{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.et small{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pin{width:96px;height:32px;border:1px solid var(--line);border-radius:3px;padding:0 6px;text-align:right;background:#fff;font-variant-numeric:tabular-nums}
.unset{color:var(--mute);font-size:12px}
.esect{font-size:12px;letter-spacing:.1em;color:var(--mute);margin:14px 0 4px}
.etable{width:100%;border-collapse:collapse;font-size:13px}
.etable th{text-align:left;font-weight:500;color:var(--mute);white-space:nowrap;padding:7px 8px 7px 0;vertical-align:top;font-size:12px}
.etable td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.etable th{border-bottom:1px solid var(--line)}
.etable .num{text-align:right;white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.etotal{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 6px;border-bottom:2px solid var(--ink)}
.etotal b{font-size:24px;font-variant-numeric:tabular-nums}
.esum .note,.emain .note{font-size:11.5px;color:var(--mute);line-height:1.6;margin:8px 0}
.eact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:860px){
  .ebody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .esum{border-left:0;border-top:1px solid var(--line);max-height:42vh;padding:12px 16px}
  .emain{padding:12px 16px}
  .egrid{grid-template-columns:1fr}
  .ehead h2{font-size:17px}
  .etabs{width:100%}.etabs button{flex:1;padding:8px 4px}
}

.bchips{padding-top:0}
.bchips .chip{white-space:nowrap}
.bhead{font-size:12.5px;margin:2px 0 8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.bhead b{font-size:15px;font-family:var(--serif);color:var(--accent)}
.bhead span{color:var(--mute)}
.bhead a{color:var(--accent);font-size:12px}
.hideout{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;color:var(--mute)}
.hideout input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.blist{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:6px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.brow:hover{background:var(--panel-2)}
.brow.on{background:#e4e9f1;box-shadow:inset 3px 0 0 var(--accent)}
.brow.dim{opacity:.55}
.bsw{width:34px;height:34px;border-radius:3px;border:1px solid rgba(0,0,0,.12)}
.bt{min-width:0;display:flex;flex-direction:column}
.bt b{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
/* SDF(符号付き距離関数)から Surface Nets で有機形状(頭部・手・靴)を生成する */
(function () {
  const R = window.R;
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * .25; };
  const smax = (a, b, k) => -smin(-a, -b, k);
  const ell = (x, y, z, cx, cy, cz, rx, ry, rz) => {
    const px = (x - cx) / rx, py = (y - cy) / ry, pz = (z - cz) / rz;
    const k0 = Math.sqrt(px * px + py * py + pz * pz);
    const qx = px / rx, qy = py / ry, qz = pz / rz;
    const k1 = Math.sqrt(qx * qx + qy * qy + qz * qz);
    return k1 < 1e-9 ? -Math.min(rx, ry, rz) : k0 * (k0 - 1) / k1;
  };

    const pax = x - ax, pay = y - ay, paz = z - az, bax = bx - ax, bay = by - ay, baz = bz - az;
    let h = (pax * bax + pay * bay + paz * baz) / (bax * bax + bay * bay + baz * baz);
    h = Math.max(0, Math.min(1, h));
    const dx = pax - bax * h, dy = pay - bay * h, dz = paz - baz * h;
    return Math.sqrt(dx * dx + dy * dy + dz * dz) - (ra + (rb - ra) * h);

  /* 疎→密の2段サンプリングで計算量を抑えた Surface Nets */

    for (let bk = 0; bk < nz; bk += B) for (let bj = 0; bj < ny; bj += B) for (let bi = 0; bi < nx; bi += B) {
      const cx = min[0] + (bi + B / 2) * h, cy = min[1] + (bj + B / 2) * h, cz = min[2] + (bk + B / 2) * h;
      const d = f(cx, cy, cz);
      const far = Math.abs(d) > diag;
      const ek = Math.min(bk + B, nz), ej = Math.min(bj + B, ny), ei = Math.min(bi + B, nx);

    }

    const c = new Float32Array(8);
    const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
    for (let k = 0; k < nz - 1; k++) for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {

      pos.push(min[0] + (i + sx / n) * h, min[1] + (j + sy / n) * h, min[2] + (k + sz / n) * h);

    const quad = (a, b, c2, d, flip) => { if (a < 0 || b < 0 || c2 < 0 || d < 0) return; if (flip) idx.push(a, c2, b, a, d, c2); else idx.push(a, b, c2, a, c2, d); };

    const nrm = new Float32Array(pos.length), e = h * .6;

      for (let n = 0; n < pos.length; n += 3) { colorFn(pos[n], pos[n + 1], pos[n + 2], t); col[n] = t.r; col[n + 1] = t.g; col[n + 2] = t.b; }

  };

  const HC = [0, 1.668, .012]; // 頭部中心
  /* 顔の左右対称部分 */
  function headSDF(wx, wy, wz) {
    const x = Math.abs(wx - HC[0]), y = wy - HC[1], z = wz - HC[2];
    let d = ell(x, y, z, 0, .034, -.012, .072, .081, .0925); // 頭蓋
    d = smin(d, ell(x, y, z, 0, -.018, .018, .0605, .068, .0695), .03); // 顔面
    d = smin(d, ell(x, y, z, .01, -.07, .028, .04, .025, .05), .03); // 顎
    d = smin(d, ell(x, y, z, 0, -.0925, .062, .0172, .0115, .0135), .024); // 顎先
    d = smin(d, ell(x, y, z, .044, -.012, .055, .018, .016, .019), .03); // 頬骨
    d = smin(d, ell(x, y, z, .018, .0235, .081, .03, .0085, .011), .02); // 眉弓

    // 鼻

    d = smin(d, ell(x, y, z, .0108, -.0345, .0925, .0056, .0056, .0076), .0075);
    d = smax(d, -ell(x, y, z, .0058, -.0418, .0975, .0028, .0018, .0036), .002); // 鼻孔
    // 唇
    d = smin(d, ell(x, y, z, 0, -.0578, .0862, .0188, .0036, .0088), .0065);
    d = smin(d, ell(x, y, z, 0, -.0655, .0845, .0158, .0048, .0088), .0065);
    d = smax(d, -ell(x, y, z, 0, -.0612, .0965, .0212, .00062, .0115), .0012); // 口裂
    d = smax(d, -ell(x, y, z, 0, -.047, .0955, .0022, .0052, .003), .0045); // 人中
    // 上下まぶた
    d = smin(d, ell(x, y, z, .0312, .0082, .0795, .0148, .0032, .0098), .0042);
    d = smin(d, ell(x, y, z, .0312, -.0062, .0802, .0138, .0018, .0078), .0036);

    ear = smax(ear, -ell(ex, ey, ez, .007, -.002, .001, .0048, .019, .0108), .003);
    d = smin(d, ear, .004);
    // 首
    d = smin(d, cap(x, y, z, 0, -.2, -.034, 0, -.055, -.018, .0585, .0535), .028);
    d = smin(d, ell(x, y, z, 0, -.135, .03, .0085, .014, .0075), .012); // 喉仏
    return d;
  }
  function eyeDark(x, y, z) { return Math.exp(-(Math.pow((x - .0315) / .024, 2) + Math.pow((y - .004) / .015, 2))); }

  R.buildHead = function () {
    const skinA = new THREE.Color('#d8a98c'), lip = new THREE.Color('#b97a6c'), cheek = new THREE.Color('#d4957c'), beard = new THREE.Color('#b99a8a'), shadow = new THREE.Color('#b78466');
    const col = (wx, wy, wz, t) => {
      const x = Math.abs(wx), y = wy - HC[1], z = wz - HC[2];
      t.copy(skinA);
      t.lerp(cheek, .55 * Math.exp(-(Math.pow((x - .043) / .024, 2) + Math.pow((y + .025) / .024, 2))));
      t.lerp(cheek, .55 * Math.exp(-(Math.pow(x / .012, 2) + Math.pow((y + .032) / .014, 2))) * (z > .08 ? 1 : 0));
      t.lerp(beard, .42 * Math.exp(-Math.pow((y + .078) / .03, 2)) * (z > -.02 ? 1 : 0) * (1 - Math.exp(-Math.pow((y + .065) / .006, 2)) * Math.exp(-Math.pow(x / .022, 2))));
      t.lerp(shadow, .4 * eyeDark(x, y, z));
      t.lerp(cheek, x > .068 && z < .02 ? .35 : 0);
      const lipW = Math.exp(-(Math.pow(x / .0215, 4) + Math.pow((y + .0655) / .0108, 4)));

    // 眉
    const browD = (wx, wy, wz) => { const x = Math.abs(wx), y = wy - HC[1], z = wz - HC[2];
      const a = ell(x, y, z, .0225, .0232, .0945, .0138, .0026, .0052), b = ell(x, y, z, .0405, .0212, .0838, .0115, .0018, .0052);
      return smin(a, b, .006); };
    const brow = R.surfaceNets(browD, [-.06, 1.675, .06], [.06, 1.705, .115], .0009);
    return { skin, hair, brow, eyeR: .0118, eye: [.0312, HC[1] + .0008, HC[2] + .0688] };

  function handSDF(x, y, z, c) {
    let d = ell(x, y, z, 0, -.046, 0, .0165, .052, .044);
    d = smin(d, cap(x, y, z, 0, .03, 0, 0, -.01, 0, .027, .025), .018);
    const fingers = [[.031, .043, .027, .021, .0088], [.011, .047, .03, .022, .0092], [-.01, .044, .028, .021, .0086], [-.029, .036, .021, .018, .0074]];

      for (const [len, rr, da] of [[l1, r, .3 + .55 * c], [l2, r * .92, .42 + .6 * c], [l3, r * .82, .42 + .55 * c]]) {

        d = smin(d, cap(x, y, z, px, py, pz, nx, ny, nz, rr, rr * .93), .0058);
        px = nx; py = ny; pz = nz; a += da;
      }
    }
    // 親指
    d = smin(d, cap(x, y, z, -.004, -.018, .03, -.012, -.05, .053, .0135, .0105), .012);
    d = smin(d, cap(x, y, z, -.012, -.05, .053, -.021, -.082, .058, .0102, .0088), .005);
    return d;
  }
  R.buildHand = function (curl) {
    const skinA = new THREE.Color('#d6a488'), knuckle = new THREE.Color('#cf9078'), nail = new THREE.Color('#e7c4b4');
    return R.surfaceNets((x, y, z) => handSDF(x, y, z, curl), [-.1, -.2, -.058], [.04, .05, .08], .0019, (x, y, z, t) => {
      t.copy(skinA);
      t.lerp(knuckle, .35 * Math.exp(-Math.pow((y + .15) / .03, 2)));
      if (x > -.03 && y < -.15) t.lerp(nail, .25);
    });
  };

  /* 靴(+z がつま先、底面 y=0) */
  function shoeSDF(x, y, z) {
    const ax = x + .006 * R.sstep(.03, .17, z); // つま先は内へ流す
    let d = ell(ax, y, z, 0, .044, -.014, .04, .046, .1);
    d = smin(d, ell(ax, y, z, .0, .026, .104, .0365, .0205, .074), .03); // 前足部
    d = smin(d, ell(x, y, z, 0, .05, -.092, .033, .054, .048), .024); // 踵
    d = smin(d, cap(x, y, z, 0, .05, -.035, 0, .13, -.05, .042, .046), .03); // 足首
    d = smax(d, .013 - y, .002);
    d = smax(d, y - (.09 - z * .1), .004); // 履き口
    return d;
  }
  function soleSDF(x, y, z) {
    const ax = x + .006 * R.sstep(.03, .17, z);
    let d = ell(ax, y, z, 0, 0, .02, .046, .4, .163);
    d = smax(d, y - .0135, .0012);
    d = smax(d, .006 - y, .001);
    d = smin(d, smax(ell(x, y, z, 0, 0, -.098, .04, .4, .052), smax(y - .03, -y, .0012), .0012), .0012); // ヒール
    return d;
  }
  R.buildShoe = function () {
    const seam = new THREE.Color('#3a3a3a'), base = new THREE.Color('#ffffff');
    const col = (x, y, z, t) => {
      t.copy(base);
      const ax = x + .006 * R.sstep(.03, .17, z);
      const cap = z - (.128 - 260 * ax * ax * .32), v = Math.abs(cap);      // 一文字のキャップ線
      if (v < .0028) t.lerp(seam, .85);
      const quarter = Math.abs(Math.abs(ax) - (.018 + (.075 - z) * .1)); // 羽根の縁
      if (quarter < .002 && z > -.01 && z < .085 && y > .05) t.lerp(seam, .8);
      if (y < .018) t.multiplyScalar(.62);
    };
    return {
      upper: R.surfaceNets(shoeSDF, [-.07, .004, -.16], [.07, .2, .2], .0022, col),
      sole: R.surfaceNets(soleSDF, [-.07, -.006, -.17], [.07, .04, .22], .0024),
    };
  };
})();

/* 生地テクスチャ: 無地/ストライプ/チェック/ヘリンボーン/ドット/写真 */
(function () {

    const pt = st.pants, o = k => R.opt('pants', k, pt[k]);
    const OUT = mats.pants, hem = o('hem'), tuck = o('tuck'), belt = o('belt'), side_ = o('sidePkt');
    const bandW = belt.noband ? 0 : belt.w, top = belt.high ? 1.115 : 1.08;
    const y1 = top - bandW;
    const hemY = .114 - (hem.long || 0) * .25; // 革靴にかからない丈
    const slope = hem.slope || 0;
    const tn = tuck.n || 0;
    const seamM = (pts, sf, w, h) => R.mesh(group, R.ribbonGeo(pts, sf, w || .0014, h || .0007), R.seamMat, { noShadow: true, noReceive: true, order: 2 });
    for (const side of [1, -1]) {
      const pts = (a, y, off, out) => R.pantsPoint(side, a, y, off, out, tn);
      const pleatAt = i => (tuck.dir === 'in' ? .24 : .46) + i * .24;
      const pleat = (psi, y) => {
        if (!tn) return 0;
        const k = R.sstep(.93, y1 - .02, y);
        let d = 0;
        for (let i = 0; i < tn; i++) { const c = pleatAt(i); d += .0052 * k * R.sstep(c - .09, c, psi) * R.sstep(c + .028, c, psi); }
        return d;
      };
      const g = R.gridGeo(150, 176, (u, v, out, t) => {
        const psi = u * 2 * PI;
        const yBase = R.lerp(hemY, y1 + .002, Math.pow(v, 1));
        const yy = yBase - slope * (1 - v) * Math.max(0, -Math.cos(psi)) * (v < .1 ? 1 : 0);
        const cs = Math.cos(psi), inner = Math.max(0, -Math.sin(psi));
        const wob = Math.sin(yy * 9 + psi * 2 + side) * .6 + Math.sin(yy * 23 - psi + side * 2) * .6; // 規則的に見せないゆらぎ

          + .0022 * R.sstep(.66, .8, yy) * R.sstep(.9, .81, yy) * Math.sin(psi * 2 + yy * 52 + wob) * inner
          + .0012 * Math.exp(-Math.pow((yy - .2) / .06, 2)) * Math.sin(yy * 60 + psi * 3 + wob * 1.5)
          + .0009 * Math.exp(-Math.pow((yy - .94) / .05, 2)) * Math.max(0, -cs) * Math.sin(yy * 50 + psi * 6);
        pts(psi, yy, fold + pleat(psi, yy), out);

      }, { flip: side < 0, ao: (u, v, x, y) => 1 - .16 * R.sstep(.18, .5, Math.sin(u * 2 * PI) * -1) * R.sstep(.3, .75, y) });
      R.mesh(group, g, OUT);
      const sf = (psi, y, h, out) => pts(psi, y, h, out);
      // 脇縫い目・股下
      const line = []; const psiSeam = PI / 2 + .1;
      for (let i = 0; i <= 40; i++) line.push([psiSeam, R.lerp(hemY + .002, y1, i / 40)]);
      seamM(line, sf);
      const sst = o('sideStitch');
      if (sst.w) R.mesh(group, R.ribbonGeo(line.map(([a, y]) => [a + sst.w / 1000 / .08, y]), sf, .0009, .0009), R.stitchMat('#' + new THREE.Color(R.fabricOf(pt.fabric).color).lerp(new THREE.Color('#fff'), .3).getHexString(), sst.pick), { noShadow: true });
      const inseam = []; for (let i = 0; i <= 20; i++) inseam.push([1.5 * PI, R.lerp(hemY + .002, .82, i / 20)]);
      seamM(inseam, sf);
      // センター
      if (side === 1) {
        const fly = []; for (let i = 0; i <= 8; i++) fly.push([2 * PI - .001, R.lerp(.82, y1, i / 8)]);
      }
      // タック線
      if (tn) {
        for (let i = 0; i < tn; i++) {
          const c = pleatAt(i), l = R.bez([c, y1], [c - .004, y1 - .05], [c + .012, y1 - .125 + i * .018], 10);
          seamM(l, sf, .0034, .0062).userData.tag = 'underVest';  // 折り山の線
          R.mesh(group, R.ribbonGeo(l.map(([a2, y]) => [a2 + .045, y]), sf, .012, .0009), R.softShadow, { noShadow: true, noReceive: true, order: 2 }).userData.tag = 'underVest'; // 折りの影
        }
      } else {
        // 消しダーツ
        seamM([[.75, y1], [.76, y1 - .05]], sf, .0012);
      }

      R.pantsSidePocket(group, side_, side, sf, y1, seamM, OUT);
      // 裾
      if (hem.cuff) {
        const h = hem.cuff;
        const tu = R.gridGeo(64, 4, (u, v, out, t) => {
          const psi = u * 2 * PI, y = R.lerp(hemY, hemY + h, v);
          pts(psi, y, .0058 + .0014 * Math.sin(v * PI), out); t[0] = side * u * .85; t[1] = y;
        }, { flip: side < 0 });

        // 上端を閉じ、折り返しの段差を見せる
        const lip = R.gridGeo(64, 1, (u, v, out, t) => { pts(u * 2 * PI, hemY + h, R.lerp(.0058, 0, v), out); t[0] = u; t[1] = 0; }, { flip: side > 0 });
        R.mesh(group, lip, OUT, { noShadow: true });
        const ring = yy => { const r = []; for (let i = 0; i <= 64; i++) r.push([i / 64 * 2 * PI, yy]); return r; };
        R.mesh(group, R.ribbonGeo(ring(hemY + h + .0028), sf, .0065, .0009), R.softShadow, { noShadow: true, noReceive: true, order: 2 });
        seamM(ring(hemY + h), sf, .0022, .0066);
        seamM(ring(hemY + .0012), sf, .0016, .0066);
        for (const a2 of [PI / 2 + .1, 1.5 * PI]) R.mesh(group, R.ribbonGeo([[a2, hemY + .002], [a2, hemY + h]], sf, .0014, .0068), R.seamMat, { noShadow: true, noReceive: true, order: 2 });
      }
      if (hem.mitsu) { const pts2 = []; for (let i = 0; i <= 48; i++) pts2.push([i / 48 * 2 * PI, hemY + .035]); R.mesh(group, R.ribbonGeo(pts2, sf, .0009, .0009), R.stitchMat('#' + new THREE.Color(R.fabricOf(pt.fabric).color).lerp(new THREE.Color('#fff'), .3).getHexString(), false), { noShadow: true }); }
      if (hem.long) { const pts2 = []; for (let i = 0; i <= 48; i++) pts2.push([i / 48 * 2 * PI, hemY + .02]); R.mesh(group, R.ribbonGeo(pts2, sf, .0009, .0009), R.seamMat, { noShadow: true, noReceive: true, order: 2 }); }
      // 裾の内側
      const inner = R.gridGeo(48, 1, (u, v, out, t) => { const psi = u * 2 * PI; pts(psi, R.lerp(hemY, hemY + .03, v), -.0025, out); t[0] = u * .8; t[1] = v * .03; }, { flip: side > 0 });
      R.mesh(group, inner, mats.pantsLining || OUT, { noShadow: true });

      // ピスポケット
      R.pantsBackPocket(group, o('backPkt'), side, st, mats, y1, tn);
    }
    // フライ線
    const flyS = (x, y, h, out) => { pelvis(y, buf); const ph = R.xToPhi(buf, x, h); R.ringPt(buf, 1, ph, h, out); out.x = x; out.y = y; return out; };
    const cs = []; for (let i = 0; i <= 8; i++) cs.push([.0015, R.lerp(.88, y1, i / 8)]);
    seamM(cs, flyS, .002);
    const flyC = R.bez([.033, y1], [.034, y1 - .13], [.003, y1 - .165], 12);
    seamM(flyC, flyS, .001, .0009);
    // 背中心
    const bs = (x, y, h, out) => { pelvis(y, buf); R.ringPt(buf, 1, PI, h, out); out.y = y; return out; };
    seamM([[0, .88], [0, .99], [0, y1]], bs, .002);
    // ウエストバンド
    if (bandW) {
      const rBand = (y) => { const r = [0, 0, 0, 0]; pelvis(y, r); return r; };
      for (const side of [1, -1]) {
        const g = R.gridGeo(52, 4, (u, v, out, t) => {
          const y = R.lerp(y1, top, v), phi = u * PI, r = rBand(y);
          R.ringPt(r, side, phi, .0026 + .0012 * Math.sin(v * PI) , out); out.y = y; t[0] = y * .9; t[1] = side * phi * .135;
        }, { flip: side < 0 });
        R.mesh(group, g, OUT);
        const lineTop = R.gridGeo(52, 1, (u, v, out, t) => { const y = top, phi = u * PI, r = rBand(y); R.ringPt(r, side, phi, R.lerp(.0026, -.003, v), out); out.y = y; t[0] = 0; t[1] = phi * .1; }, { flip: side < 0 });
        R.mesh(group, lineTop, OUT, { noShadow: true });
        const seamRing = []; for (let i = 0; i <= 40; i++) seamRing.push([i / 40 * PI, y1]);
        R.mesh(group, R.ribbonGeo(seamRing, (a, y, h, out) => { const r = rBand(y); R.ringPt(r, side, a, h, out); out.y = y; return out; }, .0014, .0028), R.seamMat, { noShadow: true, noReceive: true, order: 2 });
      }
      // ベルト(ループ付きのとき)
      if (belt.loop) {
        const bm2 = R.beltMat = R.beltMat || new THREE.MeshPhysicalMaterial({ color: '#0c0b0b', roughness: .36, clearcoat: .5, clearcoatRoughness: .3 });
        const by0 = y1 + .0035, by1 = top - .0035;
        for (const side of [1, -1]) {
          const bg = R.gridGeo(52, 3, (u, v, out, t) => { const y = R.lerp(by0, by1, v), r = rBand(y); R.ringPt(r, side, u * PI, .0042 + .0007 * Math.sin(v * PI), out); out.y = y; t[0] = u; t[1] = v; }, { flip: side < 0 });
          R.mesh(group, bg, bm2);
        }
        const r0 = rBand((by0 + by1) / 2), bp = new V(); R.ringPt(r0, 1, 0, .007, bp); bp.y = (by0 + by1) / 2;
        const bk = new THREE.Mesh(new THREE.BoxGeometry(.046, .036, .006), R.buckleMat = R.buckleMat || new THREE.MeshStandardMaterial({ color: '#b9b4a6', roughness: .35, metalness: 1 })); bk.position.copy(bp); bk.castShadow = true; group.add(bk);
      }
      // ベルトループ
      const loopAt = belt.loop ? [.55, 1.15, 2.2, 2.85] : [];
      const af = (side, phi) => (x, y, h, out) => { const r = rBand(y); R.ringPt(r, side, phi + x / .145, h, out); out.y = y; return out; };
      for (const side of [1, -1]) for (const a of loopAt) {
        R.mesh(group, R.polyGeo([[-.0055, y1 - .012], [.0055, y1 - .012], [.0055, top + .002], [-.0055, top + .002]], af(side, a), { L: .007, thick: .002, edge: .002, base: .0058, flip: side < 0, uv: (x, y) => [x, y] }), OUT);
      }
      // 持ち出し
      const bandFront = (x, y, h, out) => { const r = rBand(y); const ph = R.xToPhi(r, x, h); R.ringPt(r, 1, ph, h + .0056, out); out.x = x; out.y = y; return out; };
      const bo = o('button'), bm = R.buttonMat(bo), q = new V(), n = new V();
      const ymid = (y1 + top) / 2;
      if (belt.tab === 'tri') {
        R.mesh(group, R.polyGeo([[-.052, y1], [.005, y1], [.005, top], [-.052, top], [-.0705, ymid]], bandFront, { L: .009, thick: .002, edge: .003, uv: (x, y) => [y * .9, x] }), OUT);
        bandFront(-.052, ymid, .0028, q); bandFront(-.052, ymid, .01, n); n.sub(q); R.addButton(group, q, n, .0068, bm);
      } else if (belt.tab === 'one' || belt.tab === 'two') {
        const ys2 = belt.tab === 'two' ? [ymid + bandW * .23, ymid - bandW * .23] : [ymid];
        R.mesh(group, R.polyGeo([[-.038, y1], [.005, y1], [.005, top], [-.038, top]], bandFront, { L: .009, thick: .002, edge: .003, uv: (x, y) => [y * .9, x] }), OUT);
        for (const yy of ys2) { bandFront(-.018, yy, .0028, q); bandFront(-.018, yy, .01, n); n.sub(q); R.addButton(group, q, n, .0068, bm); }
      } else {
        bandFront(.0, ymid, .0005, q);
        R.mesh(group, R.ribbonGeo([[.0, y1], [.0, top]], bandFront, .0018, .0006), R.seamMat, { noShadow: true, noReceive: true, order: 2 });
      }
      // アジャスター
      if (belt.adj) {
        const mt = R.buckleMat = R.buckleMat || new THREE.MeshStandardMaterial({ color: '#b9b4a6', roughness: .35, metalness: 1 });
        for (const side of [1, -1]) {
          const r = rBand(ymid), p = new V(); R.ringPt(r, side, PI / 2 + .1, .0052, p); p.y = ymid;
          const b = new THREE.Mesh(new THREE.BoxGeometry(.012, .021, .018), mt); b.position.copy(p); group.add(b); b.castShadow = true;
          R.mesh(group, R.polyGeo([[-.035, y1 + .006], [.035, y1 + .006], [.035, top - .006], [-.035, top - .006]], af(side, PI / 2 + .1), { L: .008, thick: .0012, edge: .002, base: .0038, flip: side < 0, uv: (x, y) => [x, y] }), OUT);
        }

    const pb = o('pBuckle');

      const yb = pb.kind === 'sideHigh' ? (y1 + top) / 2 : pb.kind === 'sideLow' ? y1 - .024 : (y1 + top) / 2 - .01;
      const phis = pb.kind === 'back' ? [[1, PI]] : [[1, 2.15], [-1, 2.15]];
      for (const [side, phi] of phis) {
        const af = (x, y, h, out) => { pelvis(y, buf); R.ringPt(buf, side, phi + x / .145, h + .0034, out); out.y = y; return out; };
        const poly = [[-.06, yb - .014], [-.01, yb - .009], [.01, yb - .009], [.06, yb - .014], [.075, yb], [.06, yb + .014], [.01, yb + .009], [-.01, yb + .009], [-.06, yb + .014], [-.075, yb]];
        R.mesh(group, R.polyGeo(poly, af, { L: .008, thick: .0018, edge: .0025, flip: side < 0, uv: (x, y) => [x, y] }), OUT);
        const q = new V(); af(0, yb, .004, q);
        const b = new THREE.Mesh(new THREE.TorusGeometry(.012, .002, 8, 4), mt); b.rotation.z = PI / 4; b.scale.set(1, 1.3, 1); b.position.copy(q); b.castShadow = true; if (phi !== PI) b.rotation.y = side * (PI - phi); group.add(b);
      }
    }
    return { top };
  };
  R.pantsSidePocket = function (group, sp, side, sf, y1, seamM, OUT) {
    const k = sp.kind; if (k === 'none') return;
    const stroke = (pts, w, h) => { seamM(pts, sf, (w || .0026) * 1.1, h || .0012).userData.tag = 'underVest'; seamM(pts, sf, (w || .0026) * 2.6, h || .0011).userData.tag = 'underVest'; };
    const P = PI / 2;
    if (k === 'slant') stroke(R.bez([1.08, y1], [1.25, y1 - .08], [1.42, y1 - .155], 10));
    else if (k === 'bias') stroke(R.bez([.95, y1], [1.12, y1 - .08], [1.28, y1 - .165], 10));
    else if (k === 'vert') stroke([[P - .02, y1], [P - .02, y1 - .16]]);
    else if (k === 'u') { stroke(R.bez([1.15, y1], [1.1, y1 - .12], [P - .05, y1 - .125], 12)); }
    else if (k === 'horiz' || k === 'jet') { stroke([[.8, y1 - .035], [1.34, y1 - .035]], .0034, .0014); }
    else if (k === 'slash') { stroke([[.95, y1 - .006], [1.4, y1 - .006]], .002); }
    else if (k === 'westL') { stroke(R.bez([.74, y1], [.86, y1 - .06], [1.28, y1 - .06], 12)); stroke([[1.28, y1 - .06], [1.34, y1 - .12]]); }
    else if (k === 'westK') { stroke([[.74, y1], [.84, y1 - .055], [1.32, y1 - .055]]); }
    else if (k === 'westR') { stroke(R.bez([.74, y1], [.88, y1 - .075], [1.34, y1 - .05], 14)); }
  };
  R.pantsBackPocket = function (group, bp, side, st, mats, y1, tn) {
    const OUT = mats.pants;
    if (bp.sides === 'none' || bp.welt === 'none') return;
    if (bp.sides === 'up' && side !== 1) {
      const sf = (x, y, h, out) => { pelvis(y, buf); R.ringPt(buf, side, PI - x / .145, h, out); out.y = y; return out; };
      const y0 = y1 - .058;
      R.mesh(group, R.polyGeo([[.052, y0 - .0028], [.15, y0 - .0028], [.15, y0 + .0028], [.052, y0 + .0028]], sf, { L: .008, thick: .001, edge: .002, flip: side > 0, uv: (x, y) => [x, y] }), OUT);
      return;
    }
    const sf = (x, y, h, out) => { pelvis(y, buf); R.ringPt(buf, side, PI - x / .145, h, out); out.y = y; return out; };
    const a = .052, b = .178, y0 = y1 - .058, flip = side > 0, uv = (x, y) => [x, y];
    const seam = (pts, w, h) => R.mesh(group, R.ribbonGeo(pts, sf, w || .0012, h || .0015), R.seamMat, { noShadow: true, noReceive: true, order: 2 });
    const cu = (a + b) / 2;
    R.mesh(group, R.ribbonGeo([[a - .001, y0 - .0066], [b + .001, y0 - .0066]], sf, .0042, .0009), R.softShadow, { noShadow: true, noReceive: true, order: 2 });
    if (bp.welt === 'slash') { seam([[a, y1 - .012], [b, y1 - .012]], .002); return; }
    if (bp.welt === 'box') { R.mesh(group, R.polyGeo([[a, y0 - .014], [b, y0 - .014], [b, y0 + .012], [a, y0 + .012]], sf, { L: .01, thick: .002, edge: .003, flip, uv }), OUT); return; }
    const wh = bp.welt === 'two' ? .0045 : .0052;
    R.mesh(group, R.polyGeo([[a, y0 - wh], [b, y0 - wh], [b, y0 + wh], [a, y0 + wh]], sf, { L: .01, thick: .0013, edge: .002, flip, uv }), OUT);
    seam([[a, bp.welt === 'two' ? y0 : y0 + wh * .8], [b, bp.welt === 'two' ? y0 : y0 + wh * .8]], .0014);
    const mat = R.buttonMat(R.opt('pants', 'button', st.pants.button));
    const q = new V(), n = new V();
    const putBtn = (y) => { sf(cu, y, .003, q); sf(cu, y, .01, n); n.sub(q); R.addButton(group, q, n, .0066, mat); };
    const f = bp.flap;
    const leftLook = side === 1;
    if (f === 'kumo' || f === 'kaku' || f === 'base') {
      const w2 = .06, hh = .055;
      const poly = f === 'kaku' ? R.rounded([[cu - w2, y0 + .006], [cu + w2, y0 + .006], [cu + w2, y0 - hh], [cu - w2, y0 - hh]], [0, 0, .007, .007])
        : f === 'base' ? [[cu - w2, y0 + .006], [cu + w2, y0 + .006], [cu + w2, y0 - hh + .012], [cu, y0 - hh - .004], [cu - w2, y0 - hh + .012]]
        : R.rounded([[cu - w2, y0 + .006], [cu + w2, y0 + .006], [cu + w2 - .004, y0 - hh + .012], [cu, y0 - hh - .006], [cu - w2 + .004, y0 - hh + .012]], [0, 0, .018, .03, .018]);
      R.mesh(group, R.polyGeo(poly, sf, { L: .01, thick: .0022, edge: .0035, base: .0012, flip, uv }), OUT);
      putBtn(y0 - hh + .018);
    } else if (f === 'bero') {
      R.mesh(group, R.polyGeo([[cu - .017, y0 + .004], [cu + .017, y0 + .004], [cu + .017, y0 - .026], [cu, y0 - .044], [cu - .017, y0 - .026]], sf, { L: .007, thick: .0018, edge: .0025, base: .0012, flip, uv }), OUT);
      putBtn(y0 - .024);
    } else if (f === 'loop') {
      R.mesh(group, R.polyGeo([[cu - .007, y0 + .01], [cu + .007, y0 + .01], [cu + .007, y0 - .022], [cu - .007, y0 - .022]], sf, { L: .007, thick: .0018, edge: .0025, base: .0012, flip, uv }), OUT);
      putBtn(y0 - .012);
    } else if ((bp.btn === 'LR') || (bp.btn === 'L' && leftLook)) {
      putBtn(y0 - .02);
    }
  };
})();

</script>
<script>
/* 衣服パーツの登録表(人物・生地とは独立)
   type: 'procedural' = 仕様(ラペル・ボタン・ポケット・ベント等)から3D形状を作る
         'glb'        = GLB の3Dパーツを人物と同じ骨格に結び付ける
   covers: このパーツを着ると隠れる人物の部位(体の突き抜け防止)
   material: 表面の素材だけを差し替えるための生地の参照先。形状は変わらない

(function () {
  const R = window.R;
  R.WARDROBE = [
    { id: 'shirt', label: 'シャツ', type: 'procedural', covers: ['torso', 'arm'], build: (g, st, m) => R.buildShirt(g, st, m), key: st => [st.shirt] },
    { id: 'pants', label: 'パンツ', type: 'procedural', covers: ['leg'], build: (g, st, m) => R.buildPants(g, st, m), key: st => [st.pants] },
    { id: 'tie', label: 'ネクタイ', type: 'procedural', covers: [], build: (g, st, m) => R.buildTie(g, st, m), key: st => [st.tie.show] },

    if (o.color === 'rainbow') return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="rb"><stop offset="0" stop-color="#c52b30"/><stop offset=".33" stop-color="#e9cf3a"/><stop offset=".66" stop-color="#2c64c0"/><stop offset="1" stop-color="#6d3aa3"/></linearGradient></defs><circle cx="50" cy="50" r="34" fill="url(#rb)"/></svg>`;
    return textThumb(o.label.slice(0, 4));
  };
  R.garmentIcon = function (g) {
    if (g === 'jacket') return frontThumb({ btn: 2, lapel: 'notch' });
    if (g === 'vest') return vestThumb({ btn: 5 });
    if (g === 'make') return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="22" width="80" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><text x="50" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="currentColor" font-family="system-ui,sans-serif">SP</text></svg>`;
    if (g === 'options') return svg(pa('M20 14 L80 14 L80 86 L20 86 Z') + pa('M30 32 L36 38 L46 26') + pa('M54 32 L72 32') + pa('M30 54 L36 60 L46 48') + pa('M54 54 L72 54') + pa('M30 74 L46 74') + pa('M54 74 L72 74'));
    if (g === 'pants') return svg(pa('M28 8 L72 8 L78 92 L56 92 L50 34 L44 92 L22 92 Z') + pa('M28 16 L72 16'));
    return svg(pa('M38 10 L50 22 L62 10 L82 22 L74 42 L68 38 L68 90 L32 90 L32 38 L26 42 L18 22 Z') + pa('M50 22 L50 90'));
  };
})();

<script>
/* 保存先: Claude アーティファクト上では共有DB+アセット、それ以外では端末内(IndexedDB) */
(function () {
  const R = window.R;
  const S = R.store = { cloud: false, ready: false, assets: null, db: null, downloads: null, listeners: new Set(), pricesRemote: null, fabricsRemote: [], looksRemote: [], fabricsLocal: [], looksLocal: [], status: '端末内' };
  const emit = () => S.listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  let idb = null;
  const openIDB = () => new Promise(res => {
    try {
      const r = indexedDB.open('relation-studio', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('fabrics', { keyPath: 'id' }); r.result.createObjectStore('looks', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  const memory = { fabrics: new Map(), looks: new Map() };
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    if (!idb) return res(fn(null));
    const t = idb.transaction(store, mode), s = t.objectStore(store), out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  const localAll = async store => idb ? (await tx(store, 'readonly', s => s.getAll())) || [] : [...memory[store].values()];
  const localPut = async (store, v) => { if (idb) await tx(store, 'readwrite', s => s.put(v)); else memory[store].set(v.id, v); };
  const localDel = async (store, id) => { if (idb) await tx(store, 'readwrite', s => s.delete(id)); else memory[store].delete(id); };

  S.init = async function () {
    idb = await openIDB();
    S.fabricsLocal = await localAll('fabrics');
    S.looksLocal = await localAll('looks');
    S.ready = true; emit();
    S.connect();
  };
  /* 共有保存先への接続は画面表示を待たせない */
  S.connect = async function () {
    if (!(window.claude && window.claude.use)) return;
    try {
      const db = await window.claude.use('db');
      if (db) {
        S.db = db; S.cloud = true; S.status = '端末間で共有';
        S.assets = await window.claude.use('assets');
        db.collection('fabrics').onSnapshot(q => { S.fabricsRemote = q.docs.map(d => Object.assign({ id: d.id }, d.data())); emit(); }, e => { console.warn(e); S.cloud = false; emit(); });
        db.collection('settings').doc('prices').onSnapshot(d => { S.pricesRemote = d.exists ? d.data() : {}; emit(); }, e => console.warn(e));
        db.collection('looks').onSnapshot(q => { S.looksRemote = q.docs.map(d => Object.assign({ id: d.id }, d.data(), { where: 'cloud' })); emit(); }, e => console.warn(e));
      }
      S.downloads = await window.claude.use('downloads');
    } catch (e) { console.warn('capability', e); }
    emit();
  };
  S.fabrics = function () {
    const m = new Map(R.SAMPLE_FABRICS.map(f => [f.id, Object.assign({}, f, { where: 'sample' })]));
    S.fabricsLocal.forEach(f => m.set(f.id, Object.assign(m.get(f.id) || {}, f, { where: 'local' })));
    S.fabricsRemote.forEach(f => m.set(f.id, Object.assign(m.get(f.id) || {}, f, { where: 'cloud' })));
    return [...m.values()].filter(f => !f.deleted);
  };
  /* ブランド生地は取り込みデータに、手で変えた分(色・金額など)を重ねる */
  S.fabric = id => {
    if (R.Brands && R.Brands.isBrandId(id)) {
      const base = R.Brands.fabric(id); if (!base) return null;
      const loc = S.fabricsLocal.find(f => f.id === id), rem = S.fabricsRemote.find(f => f.id === id);
      return Object.assign({}, base, loc || {}, rem || {});
    }
    return S.fabrics().find(f => f.id === id);
  };
  S.saveFabric = async function (f) {
    const doc = Object.assign({}, f); delete doc.where; doc.updatedAt = new Date().toISOString();
    if (S.cloud && !(doc.photo || '').startsWith('data:')) {
      await S.db.collection('fabrics').doc(doc.id).set(doc);
    } else if (S.cloud) { // 写真を共有へ上げられなかった場合は端末内
      await localPut('fabrics', doc); S.fabricsLocal = await localAll('fabrics');
    } else { await localPut('fabrics', doc); S.fabricsLocal = await localAll('fabrics'); }
    emit();
  };
  /* 生地の削除。サンプル生地は「削除済み」の印を保存して一覧から外す */
  S.deleteFabric = async function (f) {
    const isSample = R.SAMPLE_FABRICS.some(x => x.id === f.id);
    if (S.cloud) { try { await S.db.collection('fabrics').doc(f.id).delete(); } catch (e) { console.warn(e); } }
    await localDel('fabrics', f.id); S.fabricsLocal = await localAll('fabrics');
    if (isSample) await S.saveFabric({ id: f.id, deleted: true });
    else emit();
  };
  S.uploadPhoto = async function (blob) {
    if (S.assets) {
      try { const a = await S.assets.upload(blob); return { url: a.url, assetId: a.id, shared: true }; } catch (e) { console.warn(e); }
    }
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ url: r.result, shared: false }); r.onerror = rej; r.readAsDataURL(blob); });
  };
  S.looks = () => S.looksRemote.concat(S.looksLocal.map(l => Object.assign({}, l, { where: 'local' }))).sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));
  S.saveLook = async function (look, where) {
    const doc = Object.assign({}, look); delete doc.where;
    if (where === 'cloud' && S.cloud) await S.db.collection('looks').doc(doc.id).set(doc);
    else { await localPut('looks', doc); S.looksLocal = await localAll('looks'); }
    emit();
  };
  S.deleteLook = async function (look) {
    if (look.where === 'cloud' && S.cloud) await S.db.collection('looks').doc(look.id).delete();
    else { await localDel('looks', look.id); S.looksLocal = await localAll('looks'); }
    emit();
  };
  S.saveFile = async function (filename, blob) {
    if (S.downloads) {
      try { await S.downloads.save({ filename, data: blob }); return 'saved'; } catch (e) { if (e && e.code === 'declined') return 'declined'; console.warn(e); }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return 'saved';
  };
  /* 見積もり用の金額(ボタンなど生地以外)。生地・裏地の金額は各生地の price に持つ */
  const localPrices = () => { try { return JSON.parse(localStorage.getItem('relation.prices') || '{}'); } catch (e) { return {}; } };
  S.prices = () => { const p = Object.assign({ buttons: {} }, S.cloud && S.pricesRemote ? S.pricesRemote : localPrices()); p.buttons = p.buttons || {}; return p; };
  S.savePrices = async function (p) {
    if (S.cloud) await S.db.doc('settings/prices').set(p);
    else { try { localStorage.setItem('relation.prices', JSON.stringify(p)); } catch (e) { /* 保存できない環境 */ } }
    emit();
  };
  S.onChange = f => { S.listeners.add(f); return () => S.listeners.delete(f); };
  S.draft = {
    load() { try { return JSON.parse(localStorage.getItem('relation.draft3') || 'null'); } catch (e) { return null; } },
    save(v) { try { localStorage.setItem('relation.draft3', JSON.stringify(v)); } catch (e) { /* 下書きは任意 */ } },
  };
})();

</script>
<script>
/* 画面: 設定一覧→図付き選択肢、生地検索、生地管理、組み合わせ保存、画像出力 */
(function () {
  const R = window.R, S = R.stage, Store = R.store;
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let st = R.defaultState();
  const ui = { tab: 'jacket', item: null, q: '', pat: 'all', tone: 'all', dlg: null, fineOpen: false };
  R.state = st;

  const app = $('#app');
  app.innerHTML = `
  <header class="bar">
    <div class="brand">Relation<small>3D SUIT STUDIO</small></div>
    <div class="spacer"></div>
    <span class="store-badge" id="badge"><i></i><span id="badgeT">端末内</span></span>
    <button class="tbtn" id="bFab" type="button" aria-label="生地管理" title="生地管理"><span class="ico">布</span><span class="lb">生地管理</span></button>
    <button class="tbtn" id="bLooks" type="button" aria-label="呼び出し" title="呼び出し"><span class="ico">読</span><span class="lb">呼び出し</span></button>
    <button class="tbtn" id="bImg" type="button" aria-label="画像" title="画像"><span class="ico">画</span><span class="lb">画像</span></button>
    <button class="tbtn" id="bEst" type="button" aria-label="見積もり" title="見積もり"><span class="ico">見</span><span class="lb">見積もり</span></button>
    <button class="tbtn primary" id="bSave" type="button" aria-label="保存" title="保存"><span class="ico">保</span><span class="lb">保存</span></button>
  </header>
  <section class="stagewrap">
    <div id="stage" role="img" aria-label="スーツを着用した人物の3D表示。ドラッグで回転、ホイールまたは2本指で拡大縮小できます。"></div>
    <div class="dispbox" id="disp"></div>
    <button class="tbtn insidebtn" id="bInside" type="button">ジャケットの内側を見る</button>
    <div class="insidetag" id="insideTag" hidden></div>
    <div class="views" id="views"></div>
    <div class="hint">ドラッグで回転 / ホイール・2本指で拡大縮小</div>
  </section>
  <aside class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="pbody" id="pbody"></div>
  </aside>
  <div id="modalRoot"></div>`;

  /* ---------- 生地の解決 ---------- */
  S.fabricLookup = id => Store.fabric(id);
  const toast = msg => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status'); document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };

  const swatchCache = new Map();
  const swatch = f => { const k = R.fabricKey(f); if (!swatchCache.has(k)) swatchCache.set(k, R.fabricSwatch(f)); return swatchCache.get(k); };

  /* ---------- 表示切替 ---------- */
  function renderDisp() {
    $('#disp').innerHTML = `<b>人物</b>
      <div class="seg" role="radiogroup" aria-label="人物">${R.HUMAN_MODELS.map(m => `<button type="button" role="radio" data-m="${m.id}" aria-checked="${st.model === m.id}" class="${st.model === m.id ? 'on' : ''}">${esc(m.name)}</button>`).join('')}</div>
      <b>表示</b>
      <label><input type="checkbox" id="dJ" ${st.show.jacket ? 'checked' : ''}>ジャケット</label>
      <label><input type="checkbox" id="dV" ${st.show.vest ? 'checked' : ''}>ベスト</label>
      <label><input type="checkbox" id="dT" ${st.tie.show ? 'checked' : ''}>ネクタイ <input type="color" id="dTC" value="${st.tie.color}" aria-label="ネクタイの色"></label>
      <label>柄 <select id="dTP" style="height:24px;border:1px solid var(--line);background:#fff;font-size:12px">${[['solid', '無地'], ['stripe', 'ストライプ'], ['dot', 'ドット'], ['check', 'チェック']].map(([v, l]) => `<option value="${v}" ${st.tie.pattern === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
    $('#disp').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if (st.model === b.dataset.m) return; st.model = b.dataset.m; renderDisp(); switchModel(); commit(); });
    $('#dJ').onchange = e => { st.show.jacket = e.target.checked; S.tempHide = []; commit(); };
    $('#dV').onchange = e => { st.show.vest = e.target.checked; S.tempHide = []; commit(); };
    $('#dT').onchange = e => { st.tie.show = e.target.checked; commit(); };
    $('#dTC').oninput = e => { st.tie.color = e.target.value; st.tie.show = true; commit(); };
    $('#dTP').onchange = e => { st.tie.pattern = e.target.value; commit(); };
  }
  function switchModel() {
    const id = st.model;
    return S.setModel(id).then(() => { if (st.model === id) S.apply(st, { force: true }); });
  }
  const viewBtns = [['front', '正面'], ['angle', '斜め'], ['side', '側面'], ['back', '背面'], ['up', '上'], ['down', '下'], ['reset', '元に戻す']];
  function renderViews() {
    const el = $('#views');
    el.innerHTML = viewBtns.map(([k, l]) => `<button type="button" data-v="${k}">${l}</button>`).join('');
    el.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const k = b.dataset.v; S.autoBack = null;
      if (k === 'reset') { S.tempHide = []; setInside(false); S.setView('angle'); commit(); return; }
      if (k === 'up') { S.goal.pitch = 52; return; }
      if (k === 'down') { S.goal.pitch = -30; return; }
      S.setView(k);
    };
  }
  function setInside(on) {
    const was = S.mode === 'inside';
    if (on && !was) S.savedOrbit = Object.assign({}, S.goal);
    S.setMode(on ? 'inside' : 'worn', st);
    $('#bInside').textContent = on ? '着用表示に戻す' : 'ジャケットの内側を見る';
    if (on) S.setView('inside');
    else if (was && S.savedOrbit) { Object.assign(S.goal, S.savedOrbit); S.savedOrbit = null; }
    renderInsideTag();
  }
  /* 向きだけ変える。拡大率と高さは触らない */
  function faceBack(back) {
    if (back) { if (!S.autoBack) { S.autoBack = { yaw: S.goal.yaw }; S.setYaw(180); } }
    else if (S.autoBack) { S.setYaw(S.autoBack.yaw); S.autoBack = null; }
  }
  function renderInsideTag() {
    const tag = $('#insideTag');
    if (S.mode !== 'inside') { tag.hidden = true; return; }
    const l = R.opt('jacket', 'liningSpec', st.jacket.liningSpec), f = R.fabricOf(st.jacket.lining);
    tag.hidden = false;
    tag.innerHTML = `<strong>${esc(l.label)}${l.code ? ` (${esc(l.code)})` : ''}</strong>裏地: ${esc(f.name || '')}<br>袖裏: ${l.noSleeve ? 'なし' : 'あり'}`;
  }
  $('#bInside').onclick = () => setInside(S.mode !== 'inside');

  /* ---------- パネル ---------- */
  function renderTabs() {
    $('#tabs').innerHTML = [['make', '作り方']].concat(R.GARMENTS, [['options', 'オプション']]).map(([k, l]) => `<button type="button" data-t="${k}" class="${ui.tab === k ? 'on' : ''}" aria-pressed="${ui.tab === k}">${R.garmentIcon(k)}<span>${l}</span></button>`).join('');
    $('#tabs').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      ui.tab = b.dataset.t; ui.item = null; ui.q = ''; ui.pat = 'all'; ui.tone = 'all';
      if (ui.tab === 'vest' && !st.show.vest) { st.show.vest = true; renderDisp(); }
      setInside(false);
      S.tempHide = ui.tab === 'jacket' || ui.tab === 'options' || ui.tab === 'make' ? [] : ui.tab === 'vest' || ui.tab === 'pants' ? ['jacket'] : ['jacket', 'vest'];
      if (ui.tab === 'pants') S.tempHide = ['jacket'];
      S.syncVisibility(st);
      renderTabs(); renderPanel();
    };
  }
  const items = g => R.CAT[g];
  function itemValue(g, it) {
    const v = st[g][it.key];
    if (it.type === 'fabric') { const f = R.fabricOf(v); return { label: f.brandFabric ? `${f.brand} ${f.code}${f.material ? ' / ' + f.material : ''}` : `${f.name || '未設定'}${f.code ? ' / ' + f.code : ''}`, ic: swatch(applyFine(f, g, it.key)) }; }
    if (it.type === 'emb') return { label: v.design === 'なし' ? 'なし' : `${v.design} / ${v.color} / ${v.pos}`, text: '刺繍' };
    const o = R.opt(g, it.key, v);
    if (it.type === 'hole') { const ps = (st.jacket.holePos || []).map(k => (R.HOLE_POS.find(x => x[0] === k) || [k, k])[1]); return { label: o.id === 'none' ? o.label : `${o.label} / ${ps.length ? ps.join('・') : '場所未選択'}`, svg: R.thumb(g, it.key, o, st) }; }
    if (it.type === 'paidLining' && o.id !== 'none' && st.jacket.paidLiningNo) return { label: `${o.label} / ${st.jacket.paidLiningNo}`, svg: R.thumb(g, it.key, o, st) };
    return { label: o.label, svg: R.thumb(g, it.key, o, st) };
  }
  const applyFine = (f, g, key) => { const ov = st.fine && st.fine[g + '.' + key]; return ov ? Object.assign({}, f, ov) : f; };
  const fineKey = (g, key) => g + '.' + key;

  function renderList() {
    const g = ui.tab, warns = R.checkRules(st);
    const row = it => {
      const v = itemValue(g, it), w = warns.filter(x => x.g === g && x.k === it.key && !x.info);
      const ic = v.ic ? `style="background-image:${v.ic}"` : '';
      return `<button class="row" type="button" data-k="${it.key}"><span class="ic" ${ic}>${v.svg || (v.text ? `<small style="font-size:11px">${v.text}</small>` : '')}</span>
        <span><span class="lbl">${esc(it.label)}${it.specOnly ? '(仕様として保存)' : ''}</span><span class="val">${esc(v.label)}</span>${w.map(x => `<span class="warnmark">要確認: ${esc(x.msg)}</span>`).join('')}</span><span class="chev" aria-hidden="true">›</span></button>`;
    };
    const off = g === 'vest' && st.vest.enabled === false;
    let body;
    if (items(g).some(i => i.sec)) { // 見出しごとに整理(ジャケット・パンツ)
      const secs = [...new Set(items(g).map(i => i.sec))];
      body = secs.map(sc => `<div class="sect">${esc(sc)}</div>${items(g).filter(i => i.sec === sc).map(row).join('')}`).join('');
    } else {
      const core = items(g).filter(i => !i.ext), ext = items(g).filter(i => i.ext);
      body = `<div class="sect">基本 ${core.length}項目</div>${core.map(row).join('')}${ext.length ? `<div class="sect">工場仕様書(PDF)の追加項目</div>${ext.map(row).join('')}` : ''}`;
    }
    return `${g === 'shirt' ? '<div class="note" style="margin-bottom:6px">シャツの選択肢は参考サイトの確認結果です(シャツ仕様のPDFは今回未受領)。</div>' : ''}
      ${body}
      <div class="tools" style="padding-bottom:6px"><button class="tbtn" type="button" id="bSpec">仕様一覧を見る</button><button class="tbtn" type="button" id="bReset">最初の状態に戻す</button></div>`;
  }
  function focusFor(it) {
    const f = it.focus || {};
    if (f.inside) { setInside(true); return; }
    setInside(false);
    S.tempHide = f.hide ? f.hide.slice() : (ui.tab === 'jacket' ? [] : S.tempHide);
    S.syncVisibility(st);
    faceBack(f.view === 'back');
  }
  function renderItem() {
    const g = ui.tab, it = items(g).find(i => i.key === ui.item), warns = R.checkRules(st).filter(x => x.g === g && x.k === it.key);
    let body = '';
    if (it.type === 'fabric') body = fabricChooser(g, it);
    else if (it.type === 'emb') body = embChooser();
    else if (it.type === 'cleric') body = optionGrid(g, it) + clericParts();
    else if (it.type === 'hole') body = optionGrid(g, it) + holePositions();
    else if (it.type === 'paid') body = paidGrid(g, it);
    else if (it.type === 'paidLining') body = paidGrid(g, it) + paidLiningNo();
    else body = optionGrid(g, it);
    return `<div class="subhead"><button class="back" type="button" id="bBack">‹ 一覧</button><h2>${esc(it.label)}</h2></div>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
      ${it.specOnly ? '<div class="note">見た目には現れない仕様です。組み合わせと一緒に保存し、仕様一覧と画像以外の記録に残します。</div>' : ''}
      <div class="warns">${warns.map(w => `<div class="warn ${w.info ? 'info' : ''}">${esc(w.msg)}</div>`).join('')}</div>${body}`;
  }
  function optionGrid(g, it) {
    const cur = st[g][it.key];
    const color = it.swatch;

  /* 画像出力 */
  function capture(scale) {
    const r = S.renderer, prev = r.getPixelRatio(), w = S.host.clientWidth, h = S.host.clientHeight;
    const target = Math.min(3, Math.max(prev, 2048 / Math.max(w, h)));
    r.setPixelRatio(target); r.setSize(w, h, false); S.applyCamera(); r.render(S.scene, S.cam);
    const src = r.domElement, cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
    const c = cv.getContext('2d'); c.drawImage(src, 0, 0);
    const u = cv.width / 1000;
    c.fillStyle = '#22344f'; c.font = `600 ${26 * u}px "Shippori Mincho", serif`; c.textBaseline = 'alphabetic'; c.fillText('Relation', 26 * u, cv.height - 26 * u);
    r.setPixelRatio(prev); r.setSize(w, h, false); S.dirty = true;
    return cv;
  }

      const draft = Store.draft.load();
      if (draft) { st = R.migrate(draft).state; R.state = st; }
      S.modelId = st.model;
      S.init($('#stage'));
      $('#stage').addEventListener('pointerdown', () => { const h = $('.hint'); if (h) h.remove(); }, { once: true });
      renderDisp(); renderViews(); renderTabs(); renderPanel();
      S.apply(st); badge();
      S.setView('angle', true);
      S.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {
      console.error(e);
      $('#stage').innerHTML = `<div class="err"><strong>3D表示を開始できませんでした</strong><p>${esc(e.message)}</p></div>`;
    }
    load.remove();
  }, 30);
  R.ui = { get state() { return st; }, loadConfig, commit, ui, setInside, renderPanel, renderTabs };
})();

</script>
</body></html>
